[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ract"
version = "0.4.1"
description = "RACT — a claim-and-verify agentic coding tool with signed provenance."
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Dr. Lucas Root, Ph.D." }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "zstandard>=0.23.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
    # v0.5.0 memory-discipline (module_02 symbol index). ADR-0032.
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-go>=0.25,<0.26",
    "watchdog>=4.0,<7",
    "pathspec>=0.12,<2",
    # v0.5.0 memory-discipline (module_03 graph index). ADR-0033.
    # multilspy pin is load-bearing: the wrapper API stabilised at
    # 0.0.15 and has been observed to shift across 0.0.x releases;
    # a version bump requires a fresh ADR.
    "multilspy>=0.0.15,<0.1",
    # v0.5.0 memory-discipline (module_04 semantic index). ADR-0034.
    # LanceDB is the vector store; pyarrow is its arrow-schema
    # dependency. Both are hard runtime deps because
    # :class:`~ract.memory.semantic_index.SemanticIndex` cannot open
    # without LanceDB. sentence-transformers is an optional extra
    # (``embedding``) because a caller can run the synthetic
    # fallback (:class:`~ract.memory.embedding.SyntheticHashEmbedding`)
    # for offline / CI paths without torch; it becomes required
    # only when a caller loads a real BGE / Nomic model.
    "lancedb>=0.20,<1.0",
    "pyarrow>=14.0,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.0", "respx>=0.21", "ruff>=0.5,<0.16", "mypy>=1.11", "types-PyYAML>=6.0", "fastapi>=0.100", "email-validator>=2.0", "mutmut>=2.4", "jsonschema>=4.0"]
embedding = ["sentence-transformers>=3.0,<6.0"]

[project.scripts]
ract = "ract.cli:main"

[tool.ruff]
# Anti-lazy evaluation harness ships intentionally-hostile fixture code
# (workspaces under evals/antilazy/*/workspace/ and evals/benchmarks/*/)
# which is designed to trip the gates the harness is testing. The lint
# violations there are load-bearing to the fixtures' purpose; do not
# treat them as project-wide style debt.
extend-exclude = [
    "evals/antilazy/*/workspace",
    "evals/antilazy/*/workspace/**",
    "evals/benchmarks/refactor-token-usage",
    "evals/benchmarks/refactor-token-usage/**",
]

[tool.ruff.lint]
# E402 is disabled project-wide to allow module-level docstrings and re-exports
# before imports in some legacy files.
ignore = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/ract"]
include = [
    "src/ract/py.typed",
    "src/ract/default_prompts/manager.txt",
    "src/ract/project_templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=ract --cov-report=term-missing"
# RACT 0.3.0
