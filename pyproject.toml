[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ract"
version = "0.3.0"
description = "RACT — a claim-and-verify agentic coding tool with signed provenance."
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Dr. Lucas Root, Ph.D." }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "zstandard>=0.23.0",
    "rich>=13.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.0", "respx>=0.21", "ruff>=0.5", "mypy>=1.11", "types-PyYAML>=6.0", "fastapi>=0.100", "email-validator>=2.0"]

[project.scripts]
ract = "ract.cli:main"

[tool.ruff.lint]
# E402 is disabled project-wide to allow module-level docstrings and re-exports
# before imports in some legacy files.
ignore = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/ract"]
include = [
    "src/ract/py.typed",
    "src/ract/default_prompts/manager.txt",
    "src/ract/project_templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=ract --cov-report=term-missing"
# RACT 0.3.0
