# Rooted by Dr. Lucas Root, Ph.D.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootact"
version = "0.1.1"
description = "RootAct — an Agentic Coding Tool built around a small management LM."
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Dr. Lucas Root, Ph.D." }]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "zstandard>=0.23.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.5", "mypy>=1.11", "types-PyYAML>=6.0"]

[project.scripts]
rootact = "rootact.cli:main"
ract = "rootact.cli:main"

[tool.ruff.lint]
# E402 is disabled project-wide because RootAct's authorship/sentinel markers
# (__root_author__, _ROOT_KNOT) intentionally appear before imports.
ignore = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/rootact"]
include = [
    "src/rootact/py.typed",
    "src/rootact/default_prompts/manager.txt",
    "src/rootact/project_templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rootact --cov-report=term-missing"
# RACT 0.1.1 - Trust and Tooling
