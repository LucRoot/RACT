name: RACT CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-format-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          ruff check src tests scripts evals
          ruff format --check src tests scripts evals
      - name: Type-check with mypy
        # tests/ carry pytest-fixture patterns that fight strict typing
        # (monkeypatched attributes, dynamic markers, capsys/tmp_path
        # duck typing). Standard practice: type-check src only. Tests
        # are covered by the pytest run.
        run: mypy src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with pytest
        run: pytest -q -o addopts="" --cov=src/ract/core --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  eval-smoke:
    # v0.4 module_07: adds one Aider Polyglot problem + one SWE-bench Lite
    # instance against the fixture provider (evals/fixtures/providers/*).
    # Fixtures are synthetic — no live-provider or upstream-registry access
    # is required on PR CI (Lateral Chain branches A and B, module_07). When
    # a fixture is missing, the runner reports SKIPPED with a specific
    # reason and the CI summary counts it (never silently green).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run v0.3 eval smoke (legacy tasks)
        run: |
          python -m ract.eval.runner evals/tasks/refactor-function --provider mock
          python -m ract.eval.runner evals/tasks/fastapi-validation --provider mock
          python -m ract.eval.runner evals/tasks/file-watcher --provider mock
      - name: Run v0.4 polyglot smoke (fixture provider)
        run: |
          python -c "
          from pathlib import Path
          from evals.polyglot.runner import RunConfig, run_problem
          from evals.polyglot.report import build_report, write_report
          result = run_problem('acronym', RunConfig(
              workspace=Path('.'),
              subset_path=Path('evals/polyglot/subset.json'),
              provider='fake',
          ))
          print(f'polyglot smoke result: {result.outcome}')
          report = build_report('fake', [result])
          write_report(report, Path('evals/runs'))
          import sys
          sys.exit(0 if result.outcome in ('passed', 'skipped') else 1)
          "
      - name: Run v0.4 swebench_lite smoke (fixture provider)
        run: |
          python -c "
          from pathlib import Path
          from evals.swe_bench_lite.runner import RunConfig, run_instance
          from evals.swe_bench_lite.report import build_report, write_report
          instance = {
              'instance_id': 'django__django-11099',
              'repo': 'django/django',
              'docker_image': 'docker.io/swebench/sweb.eval.x86_64.django__django-11099:latest',
          }
          result = run_instance(instance, RunConfig(
              workspace=Path('.'),
              instances_path=Path('evals/swe_bench_lite/instances.json'),
              provider='fake',
          ))
          print(f'swebench smoke result: {result.outcome}')
          report = build_report('fake', [result])
          write_report(report, Path('evals/runs'))
          import sys
          sys.exit(0 if result.outcome in ('passed', 'skipped') else 1)
          "
      - name: Regenerate LEADERBOARD.md (idempotent)
        run: python -m evals.leaderboard.update --repo-root .

  benchmark:
    # v0.3 Module 4: prove the milestone-driven loop beats a naive fixed-iteration
    # baseline on tokens-spent-to-passing-state. Fails if the contender is not
    # strictly better. The report is uploaded as an artifact for traceability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run benchmark
        run: python evals/benchmarks/refactor-token-usage/report.py
      - name: Upload benchmark report
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-report
          path: evals/benchmarks/refactor-token-usage/report.json
          if-no-files-found: error

