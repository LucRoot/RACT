name: RootAct CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script syntax
        run: |
          bash -n scripts/install.sh

  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Create sample rootact.yaml
        run: |
          python -c "import pathlib; pathlib.Path('rootact.yaml').write_text('manager_provider: local\nproviders:\n  local:\n    adapter: local_http\n    url: http://127.0.0.1:11434/v1\n    model: local\nprompts_dir: prompts\ncoverage_gate:\n  enabled: false\n  hard_fail: false\n  timeout: 300.0\n', encoding='utf-8')"
      - name: Enforce 90% coverage floor
        run: pytest -q --cov-fail-under=90

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Create sample rootact.yaml
        run: |
          python -c "import pathlib; pathlib.Path('rootact.yaml').write_text('manager_provider: local\nproviders:\n  local:\n    adapter: local_http\n    url: http://127.0.0.1:11434/v1\n    model: local\nprompts_dir: prompts\ncoverage_gate:\n  enabled: false\n  hard_fail: false\n  timeout: 300.0\n', encoding='utf-8')"
      - name: Run RACT self-audit commands
        run: |
          rootact doctor
          rootact auction list
          rootact skills list

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Create sample rootact.yaml
        run: |
          python -c "import pathlib; pathlib.Path('rootact.yaml').write_text('manager_provider: local\nproviders:\n  local:\n    adapter: local_http\n    url: http://127.0.0.1:11434/v1\n    model: local\nprompts_dir: prompts\ncoverage_gate:\n  enabled: false\n  hard_fail: false\n  timeout: 300.0\n', encoding='utf-8')"

      - name: Lint with ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test with pytest
        run: pytest -q --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Build package and smoke-test CLI
        run: |
          pip install build hatchling
          python -m build --wheel --no-isolation
          pip install (Get-ChildItem dist/rootact-*.whl).FullName
          rootact --help
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Build package and smoke-test CLI
        run: |
          pip install build hatchling
          python -m build --wheel --no-isolation
          pip install dist/rootact-*.whl
          rootact --help
        shell: bash
        if: runner.os != 'Windows'
# RACT 0.1.1 - Trust and tooling
