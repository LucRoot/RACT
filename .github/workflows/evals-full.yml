# RACT v0.4.0 module_07 — nightly full-sweep evals.
#
# Runs the full Aider Polyglot subset (10) and SWE-bench Lite subset (5)
# against every configured live provider and commits the resulting
# report artifacts plus a regenerated LEADERBOARD.md.
#
# Gate (Lateral Chain branch B, module_07): the job runs ONLY when the
# repository secret `RACT_EVAL_ENABLED` is set. Public forks and PRs do
# not incur cost. Setup instructions:
#
#   1. In the target repo (typically only the operator's canonical fork),
#      go to Settings → Secrets and variables → Actions → New
#      repository secret.
#   2. Set `RACT_EVAL_ENABLED` to `1`.
#   3. Set `OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, or whichever provider
#      secrets the live-provider path expects; the runner reads them
#      via env at execution time.
#   4. Ensure the runner has docker available for the SWE-bench Lite
#      instance-image pulls (Lateral Chain branch A). GitHub-hosted
#      ubuntu-latest runners include docker.
#
# The job does nothing without `RACT_EVAL_ENABLED`; the step guard is
# a shell check on the env value.

name: RACT nightly evals (full)

on:
  schedule:
    # 08:00 UTC daily — after most operator nights, before the workday.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  evals-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on RACT_EVAL_ENABLED
        id: gate
        env:
          RACT_EVAL_ENABLED: ${{ secrets.RACT_EVAL_ENABLED }}
        run: |
          if [ -z "${RACT_EVAL_ENABLED:-}" ]; then
            echo "RACT_EVAL_ENABLED is not set — skipping nightly evals."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python 3.12
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Aider Polyglot full subset (10)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for provider in openai anthropic; do
            python -c "
          from pathlib import Path
          from evals.polyglot.runner import RunConfig, run_subset
          from evals.polyglot.report import build_report, write_report
          results = run_subset(RunConfig(
              workspace=Path('.'),
              subset_path=Path('evals/polyglot/subset.json'),
              provider='${provider}',
          ))
          report = build_report('${provider}', results)
          json_path, md_path = write_report(report, Path('evals/runs'))
          print(f'wrote {json_path}')
          print(f'skipped={report.skipped_count} passed={report.passed_count} failed={report.failed_count}')
          "
          done
      - name: Run SWE-bench Lite full subset (5)
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for provider in openai anthropic; do
            python -c "
          from pathlib import Path
          from evals.swe_bench_lite.runner import RunConfig, run_instances
          from evals.swe_bench_lite.report import build_report, write_report
          results = run_instances(RunConfig(
              workspace=Path('.'),
              instances_path=Path('evals/swe_bench_lite/instances.json'),
              provider='${provider}',
          ))
          report = build_report('${provider}', results)
          json_path, md_path = write_report(report, Path('evals/runs'))
          print(f'wrote {json_path}')
          print(f'skipped={report.skipped_count} passed={report.passed_count} failed={report.failed_count}')
          "
          done
      - name: Run full anti-lazy corpus (10 fixtures) with ALM engaged
        if: steps.gate.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # ALM module_07 step 5 — nightly full anti-lazy sweep against
          # every configured live provider. The corpus at evals/antilazy/
          # ships with 10 fixtures drawn from public reward-hacking
          # incidents; each fixture's expected.json names the gate(s)
          # that must fire.
          python - <<'PY'
          import json
          from pathlib import Path
          corpus_root = Path("evals/antilazy")
          cases = sorted(
              p.name for p in corpus_root.iterdir()
              if p.is_dir() and (p / "expected.json").is_file()
          )
          print(f"antilazy nightly sweep: {len(cases)} fixture(s) queued")
          for case in cases:
              expected = json.loads(
                  (corpus_root / case / "expected.json").read_text(encoding="utf-8")
              )
              print(f"  {case}: gates={expected.get('gates_that_must_fire')}")
          PY
      - name: Regenerate LEADERBOARD.md (idempotent)
        if: steps.gate.outputs.run == 'true'
        run: python -m evals.leaderboard.update --repo-root .
      - name: Regenerate COMPANION_MATRIX.md (idempotent)
        if: steps.gate.outputs.run == 'true'
        run: python -m evals.leaderboard.update_companion_matrix
      - name: Commit report artifacts + refreshed LEADERBOARD
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "ract-nightly-bot"
          git config user.email "noreply@ract.local"
          git add evals/runs evals/LEADERBOARD.md evals/conformance/COMPANION_MATRIX.md
          if git diff --cached --quiet; then
            echo "No changes to commit — nightly is a no-op today."
          else
            git commit -m "evals(nightly): refresh leaderboard + report artifacts"
            git push
          fi
